plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				url 'https://jitpack.io'
			}
		}
		filter {
			includeGroup "com.github.ramixin"
		}
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven {
		name 'Xander Maven'
		url 'https://maven.isxander.dev/releases'
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	// JEI
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}

	// RRV
	maven {
		name = "Cassian's Maven"
		url = uri("https://maven.cassian.cc")
	}

	maven {
		name = "Sinytra"
		url = uri("https://maven.sinytra.org")
	}
	mavenCentral()
}

def dateFormat = new Date().format("yy.MM.dd")

tasks.register("buildDated") {
	group = "build"
	description = "Assembles project with date in archive filenames"
	dependsOn "build"
}

gradle.taskGraph.whenReady { graph ->
	def dated = graph.hasTask(tasks.buildDated)

	tasks.matching { it.name in ["jar", "sourcesJar"] }.configureEach {
		def prefix = dated ? "${dateFormat}-" : ""
		archiveBaseName.set("${prefix}${archives_base_name}")
		archiveVersion.set("${mod_version}+mc${minecraft_version}")
	}
}

sourceSets {
	main {
		java {
			srcDir "src/client/java"
		}
		resources {
			srcDir "src/client/resources"
			srcDir "src/main/generated"
			exclude ".cache/**"
		}
	}
}

def accessWidenerFile = file("src/main/resources/enderscape.accesswidener")

def generateDevAccessTransformer = tasks.register("generateDevAccessTransformer") {
	def output = layout.buildDirectory.file("neoforge/accesstransformer.cfg")
	inputs.file(accessWidenerFile)
	outputs.file(output)

	doLast {
		def entries = []
		accessWidenerFile.eachLine { raw ->
			def line = raw.replaceFirst(/#.*$/, "").trim()
			if (line.isEmpty()) {
				return
			}
			def parts = line.split(/\s+/)
			if (parts[0] == "classTweaker" || parts[0] == "accessWidener") {
				return
			}
			def directive = parts[0].replaceFirst(/^transitive-/, "")
			def kind = parts[1]
			def owner = parts[2].replace("/", ".")
			def modifier = switch (directive + " " + kind) {
				case "accessible class", "accessible method", "accessible field" -> "public"
				case "extendable class", "extendable method", "mutable field" -> "public-f"
				default -> throw new GradleException("Unsupported class tweaker entry: " + raw)
			}
			switch (kind) {
				case "class" -> entries.add(modifier + " " + owner)
				case "method" -> entries.add(modifier + " " + owner + " " + parts[3] + parts[4])
				case "field" -> entries.add(modifier + " " + owner + " " + parts[3])
			}
		}
		def target = output.get().asFile
		target.parentFile.mkdirs()
		target.text = entries.join("\n") + "\n"
	}
}

def ffapiInterfaceInjectionFiles = configurations.create("ffapiInterfaceInjection") {
	canBeConsumed = false
	canBeResolved = true
	attributes {
		attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, "interfaceinjection"))
	}
}

def generateDevInterfaceInjection = tasks.register("generateDevInterfaceInjection") {
	def output = layout.buildDirectory.file("neoforge/interfaceinjection.json")
	inputs.files(ffapiInterfaceInjectionFiles)
	outputs.file(output)

	doLast {
		def simpleName = { String name -> name.replaceFirst(/<.*$/, "").tokenize("/").last() }
		def merged = new LinkedHashMap<String, List<String>>()
		ffapiInterfaceInjectionFiles.files.each { file ->
			new groovy.json.JsonSlurper().parse(file).each { String target, List<String> interfaces ->
				def kept = merged.computeIfAbsent(target) { [] }
				interfaces.each { String injected ->
					def clash = kept.find { simpleName(it) == simpleName(injected) }
					if (clash == null) {
						kept.add(injected)
					} else {
						logger.warn("Skipping interface injection of {} into {}, its simple name clashes with {}", injected, target, clash)
					}
				}
			}
		}
		def target = output.get().asFile
		target.parentFile.mkdirs()
		target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged))
	}
}

neoForge {
	version = project.neo_version

	accessTransformers {
		from(generateDevAccessTransformer)
	}

	interfaceInjectionData {
		from(generateDevInterfaceInjection)
	}

	runs {
		client {
			client()
			gameDirectory = file("run")
		}
		server {
			server()
			programArgument "--nogui"
			gameDirectory = file("run_server")
		}
		datagen {
			client()
			gameDirectory = layout.buildDirectory.dir("datagen/run")
			systemProperty "fabric-api.datagen", "true"
			systemProperty "fabric-api.datagen.output-dir", layout.buildDirectory.dir("datagen/output").get().asFile.absolutePath
			systemProperty "fabric-api.datagen.modid", "enderscape"
		}
		configureEach {
			systemProperty "mixin.debug.export", "true"
		}
	}

	mods {
		enderscape {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "org.sinytra.launchpad:launchpad:${project.launchpad_version}"
	implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.ffapi_version}"
	accessTransformers "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.ffapi_version}"
	ffapiInterfaceInjection "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.ffapi_version}"

	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	implementation "maven.modrinth:lithostitched:${project.lithostitched_version}"
	implementation "maven.modrinth:trim-patcher:${project.trim_patcher_version}"

	compileOnly("mezz.jei:jei-26.2-common-api:${jei_version}") {
		transitive = false
	}
	compileOnly("mezz.jei:jei-26.2-neoforge-api:${jei_version}") {
		transitive = false
	}

	compileOnly("cc.cassian.rrv:reliable-recipe-viewer-neoforge:${rrv_version}") {
		transitive = false
	}

	switch (project.recipe_viewer) {
		case "rrv" -> runtimeOnly("cc.cassian.rrv:reliable-recipe-viewer-neoforge:${rrv_version}")
		case "jei" -> runtimeOnly("mezz.jei:jei-26.2-neoforge:${jei_version}")
	}
}

configurations.runtimeClasspath {
	exclude group: "org.sinytra", module: "forgified-fabric-loader"
}

def fabricModJson = new groovy.json.JsonSlurper().parse(file("src/main/resources/fabric.mod.json"))

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}

	def placeholderProperties = [
		"version"        : project.version,
		"mod_name"       : fabricModJson.name,
		"mod_authors"    : fabricModJson.authors.collect { it instanceof Map ? it.name : it }.join(", "),
		"mod_description": fabricModJson.description,
		"mod_license"    : fabricModJson.license,
		"mod_logo"       : fabricModJson.icon
	]
	inputs.properties placeholderProperties

	filesMatching("META-INF/neoforge.mods.toml") {
		expand placeholderProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE.md") {
		rename { "LICENSE_enderscape" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

publishMods {
	changelog = System.getenv("CHANGELOG")
	type = project.mod_version.contains("-") ? BETA : STABLE
	file = jar.archiveFile
	modLoaders.add("neoforge")

	if (System.getenv("CURSEFORGE")) {
		curseforge {
			projectId = "536638"
			accessToken = System.getenv("CURSEFORGE")
			client = true
			server = true

			minecraftVersions.add((project.minecraft_version.contains("-") ? ((String) project.minecraft_version.split("-")[0] + "-snapshot") : project.minecraft_version))
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("forgified-fabric-api")
			requires("launchpad")
			requires("yacl")
			requires("lithostitched")
			requires("trim-patcher")
		}
	}

	if (System.getenv("MODRINTH")) {
		modrinth {
			accessToken = System.getenv("MODRINTH")
			projectId = 'btCrWvHr'

			minecraftVersions.add(project.minecraft_version);
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("forgified-fabric-api")
			requires("launchpad")
			requires("yacl")
			requires("lithostitched")
			requires("trim-patcher")
		}
	}
}