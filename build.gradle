plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				url 'https://jitpack.io'
			}
		}
		filter {
			includeGroup "com.github.ramixin"
		}
	}
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
	maven {
		name 'Xander Maven'
		url 'https://maven.isxander.dev/releases'
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	// JEI
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}

	// RRV
	maven {
		name = "Cassian's Maven"
		url = uri("https://maven.cassian.cc")
	}
}

def dateFormat = new Date().format("yy.MM.dd")

tasks.register("buildDated") {
	group = "build"
	description = "Assembles project with date in archive filenames"
	dependsOn "build"
}

gradle.taskGraph.whenReady { graph ->
	def dated = graph.hasTask(tasks.buildDated)

	tasks.matching { it.name in ["jar", "sourcesJar"] }.configureEach {
		def prefix = dated ? "${dateFormat}-" : ""
		archiveBaseName.set("${prefix}${archives_base_name}")
		archiveVersion.set("${mod_version}+mc${minecraft_version}")
	}
}

sourceSets {
	main {
		java {
			srcDir "src/client/java"
		}
		resources {
			srcDir "src/client/resources"
			srcDir "src/main/generated"
			exclude ".cache/**"
		}
	}
}

neoForge {
	version = project.neo_version
	validateAccessTransformers = true

	runs {
		client {
			client()
			gameDirectory = file("run")
			systemProperty "mixin.debug.export", "true"
		}
		server {
			server()
			programArgument "--nogui"
			gameDirectory = file("run_server")
			systemProperty "mixin.debug.export", "true"
		}
		data {
			clientData()
			gameDirectory = layout.buildDirectory.dir("datagen/run")
			programArguments.addAll("--mod", "enderscape", "--all", "--flat", "--output", file("src/main/generated").absolutePath, "--existing", file("src/main/resources").absolutePath)
		}
	}

	mods {
		enderscape {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	implementation "maven.modrinth:lithostitched:${project.lithostitched_version}"

	compileOnly("mezz.jei:jei-${project.jei_minecraft_version}-common-api:${jei_version}") {
		transitive = false
	}
	compileOnly("mezz.jei:jei-${project.jei_minecraft_version}-neoforge-api:${jei_version}") {
		transitive = false
	}

	compileOnly("cc.cassian.rrv:reliable-recipe-viewer-neoforge:${rrv_version}") {
		transitive = false
	}

	switch (project.recipe_viewer) {
		case "rrv" -> runtimeOnly("cc.cassian.rrv:reliable-recipe-viewer-neoforge:${rrv_version}")
		case "jei" -> runtimeOnly("mezz.jei:jei-${project.jei_minecraft_version}-neoforge:${jei_version}")
	}
}

processResources {
	def modProperties = [
		"version"                    : project.version,
		"loader_version_range"       : project.loader_version_range,
		"neo_version_range"          : project.neo_version_range,
		"minecraft_version_range"    : project.minecraft_version_range,
		"yacl_version_range"         : project.yacl_version_range,
		"lithostitched_version_range": project.lithostitched_version_range
	]
	inputs.properties modProperties

	filesMatching("META-INF/neoforge.mods.toml") {
		expand modProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE.md") {
		rename { "LICENSE_enderscape" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

publishMods {
	changelog = System.getenv("CHANGELOG")
	type = project.mod_version.contains("-") ? BETA : STABLE
	file = jar.archiveFile
	modLoaders.add("neoforge")
	version = "${mod_version}+mc${minecraft_version}"

	if (System.getenv("CURSEFORGE")) {
		curseforge {
			projectId = "536638"
			accessToken = System.getenv("CURSEFORGE")
			client = true
			server = true

			minecraftVersions.add((project.minecraft_version.contains("-") ? ((String) project.minecraft_version.split("-")[0] + "-snapshot") : project.minecraft_version))
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("yacl")
			requires("lithostitched")
		}
	}

	if (System.getenv("MODRINTH")) {
		modrinth {
			accessToken = System.getenv("MODRINTH")
			projectId = 'btCrWvHr'

			minecraftVersions.add(project.minecraft_version);
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("yacl")
			requires("lithostitched")
		}
	}
}